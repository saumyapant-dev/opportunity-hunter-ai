services:
  - type: web
    name: opportunity-hunter-ai
    runtime: python
    plan: free
    branch: main
    buildCommand: cd frontend && npm install && npm run build && cd ../backend && pip install -r requirements.txt
    startCommand: uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: NODE_VERSION
        value: 20.18.0
      - key: ENVIRONMENT
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: LLM_PROVIDER
        value: mock
      - key: DATABASE_PATH
        value: backend/data/opportunities.db
      - key: CORS_ORIGINS
        value: "*"
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: N8N_INTEGRATION_ENABLED
        value: "false"
